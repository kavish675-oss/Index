name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.9 }
      - name: Arrange files
        run: |
          mkdir -p app/src/main/java/com/j4/trader
          mv AndroidManifest.xml app/src/main/
          mv MainActivity.java app/src/main/java/com/j4/trader/
          mv app.gradle app/build.gradle
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: J4Trader-apk, path: app/build/outputs/apk/debug/*.apk }
